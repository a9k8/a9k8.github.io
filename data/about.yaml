content: |
  I am Aniket Junghare, a PhD student at [Indian Institute of Technology, Bombay](https://www.iitb.ac.in), supervised by [Dr. Biplab Banerjee](https://biplab-banerjee.github.io) at the [VIMAGE Lab](https://vimage.iitb.ac.in). My research focuses on latent prediction [[(JEPA)]] paradigms for self-supervised and multimodal pretraining, capturing spectral, spatial, and semantic structure across heterogeneous sensing modalities such as SAR, optical, and hyperspectral imagery. I aim to develop geospatial foundation models that generalize across sensing modalities and downstream Earth observation tasks with minimal supervision.
